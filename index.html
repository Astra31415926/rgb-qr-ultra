<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QRGB Ultra - Скрытые каналы</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    <style>
        body { background: #0a0a0a; color: #eee; font-family: sans-serif; }
        .tab-active { border-bottom: 2px solid #0088ff; color: #0088ff; }
        canvas { max-width: 100%; height: auto; border-radius: 8px; }
        .channel-input { background: #111; border: 1px solid #333; padding: 10px; border-radius: 8px; width: 100%; margin-bottom: 10px; }
    </style>
</head>
<body class="p-4">

    <header class="text-center mb-6">
        <h1 class="text-2xl font-bold text-white">▣ QRGB Ultra</h1>
        <p class="text-gray-500 text-sm">Скрытая стеганография R-G-B</p>
    </header>

    <nav class="flex mb-6 border-b border-gray-800">
        <button id="tabGenBtn" class="flex-1 py-2 tab-active">Создать</button>
        <button id="tabScanBtn" class="flex-1 py-2 text-gray-500">Сканировать</button>
    </nav>

    <section id="genSection">
        <div class="flex flex-col items-center">
            <div class="bg-white p-2 rounded-lg mb-4">
                <canvas id="mainCanvas" width="512" height="512" class="w-64 h-64"></canvas>
            </div>
            
            <div class="w-full max-w-sm">
                <label class="text-xs text-red-500 font-bold">RED CHANNEL (Декор)</label>
                <input type="text" id="inputR" class="channel-input" placeholder="Текст для красного канала...">
                
                <label class="text-xs text-green-500 font-bold">GREEN CHANNEL (Декор)</label>
                <input type="text" id="inputG" class="channel-input" placeholder="Текст для зеленого канала...">
                
                <label class="text-xs text-blue-400 font-bold">BLUE CHANNEL (Секретные данные)</label>
                <input type="text" id="inputB" class="channel-input" placeholder="Этот QR будет скрыт...">
                
                <button id="downloadBtn" class="w-full bg-blue-600 py-3 rounded-xl font-bold mt-2">Скачать PNG</button>
            </div>
        </div>
    </section>

    <section id="scanSection" class="hidden text-center">
        <div class="space-y-4">
            <button id="startCamBtn" class="w-full bg-green-600 py-4 rounded-xl font-bold">Включить камеру</button>
            <input type="file" id="fileInput" accept="image/*" class="hidden">
            <button onclick="document.getElementById('fileInput').click()" class="w-full bg-gray-800 py-4 rounded-xl border border-gray-600">Загрузить файл</button>
        </div>
        
        <video id="video" class="hidden w-full mt-4 rounded-lg"></video>
        <div id="result" class="mt-6 p-4 bg-gray-900 rounded-lg text-green-400 font-mono break-all hidden"></div>
    </section>

    <div id="qrHelper" class="hidden"></div>

    <script>
        const mainCanvas = document.getElementById('mainCanvas');
        const ctx = mainCanvas.getContext('2d');
        const inputs = ['inputR', 'inputG', 'inputB'];
        
        // --- ЛОГИКА ГЕНЕРАЦИИ (Живое обновление) ---
        async function updateQR() {
            const size = 512;
            const finalData = ctx.createImageData(size, size);
            
            // Получаем данные QR для каждого канала
            const layers = await Promise.all(inputs.map(id => {
                return new Promise(resolve => {
                    const text = document.getElementById(id).value || " ";
                    const helper = document.getElementById('qrHelper');
                    helper.innerHTML = '';
                    new QRCode(helper, { text: text, width: size, height: size, correctLevel: QRCode.CorrectLevel.L });
                    setTimeout(() => {
                        const canvas = helper.querySelector('canvas');
                        resolve(canvas.getContext('2d').getImageData(0,0,size,size).data);
                    }, 50);
                });
            }));

            for (let i = 0; i < finalData.data.length; i += 4) {
                // Красный канал (R) берет данные из первого инпута
                finalData.data[i]     = layers[0][i] < 128 ? 0 : 255; 
                // Зеленый канал (G) из второго
                finalData.data[i + 1] = layers[1][i] < 128 ? 0 : 255;
                // Синий канал (B) из третьего (наш секретный)
                finalData.data[i + 2] = layers[2][i] < 128 ? 0 : 255;
                finalData.data[i + 3] = 255; // Непрозрачность
            }
            ctx.putImageData(finalData, 0, 0);
        }

        inputs.forEach(id => document.getElementById(id).addEventListener('input', updateQR));

        // --- ЛОГИКА СКАНЕРА (Разделение на каналы) ---
        async function scanImage(imageSource) {
            const canvas = document.createElement('canvas');
            const sCtx = canvas.getContext('2d');
            canvas.width = imageSource.width || imageSource.videoWidth;
            canvas.height = imageSource.height || imageSource.videoHeight;
            sCtx.drawImage(imageSource, 0, 0);
            
            const rawData = sCtx.getImageData(0,0,canvas.width, canvas.height);
            const resDiv = document.getElementById('result');

            // Проверяем по очереди: Синий, Зеленый, Красный
            for (let channelIdx = 2; channelIdx >= 0; channelIdx--) {
                const monoBuffer = new Uint8ClampedArray(rawData.data.length);
                for (let i = 0; i < rawData.data.length; i += 4) {
                    const val = rawData.data[i + channelIdx];
                    const bw = val < 128 ? 0 : 255;
                    monoBuffer[i] = monoBuffer[i+1] = monoBuffer[i+2] = bw;
                    monoBuffer[i+3] = 255;
                }
                const code = jsQR(monoBuffer, canvas.width, canvas.height);
                if (code) {
                    resDiv.classList.remove('hidden');
                    resDiv.innerText = "Найдено в канале " + (channelIdx === 2 ? "BLUE" : channelIdx === 1 ? "GREEN" : "RED") + ": " + code.data;
                    return true;
                }
            }
            return false;
        }

        // Обработка файла
        document.getElementById('fileInput').onchange = e => {
            const img = new Image();
            img.onload = () => scanImage(img);
            img.src = URL.createObjectURL(e.target.files[0]);
        };

        // Включение камеры
        document.getElementById('startCamBtn').onclick = async () => {
            const video = document.getElementById('video');
            const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
            video.srcObject = stream;
            video.classList.remove('hidden');
            video.play();
            
            const loop = () => {
                if (video.paused || video.ended) return;
                scanImage(video);
                requestAnimationFrame(loop);
            };
            requestAnimationFrame(loop);
        };

        // Переключение табов
        document.getElementById('tabGenBtn').onclick = () => {
            document.getElementById('genSection').classList.remove('hidden');
            document.getElementById('scanSection').classList.add('hidden');
            document.getElementById('tabGenBtn').classList.add('tab-active');
            document.getElementById('tabScanBtn').classList.remove('tab-active');
        };
        document.getElementById('tabScanBtn').onclick = () => {
            document.getElementById('scanSection').classList.remove('hidden');
            document.getElementById('genSection').classList.add('hidden');
            document.getElementById('tabScanBtn').classList.add('tab-active');
            document.getElementById('tabGenBtn').classList.remove('tab-active');
        };
        
        // Скачивание
        document.getElementById('downloadBtn').onclick = () => {
            const link = document.createElement('a');
            link.download = 'qrgb_art.png';
            link.href = mainCanvas.toDataURL();
            link.click();
        };

        // Стартовая инициализация
        updateQR();
    </script>
</body>
</html>
