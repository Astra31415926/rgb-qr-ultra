<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fast QR Scanner</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body { margin: 0; background: #000; font-family: sans-serif; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        #reader { width: 100%; height: 80vh; }
        #result { 
            background: #fff; color: #000; padding: 15px; margin: 10px; 
            border-radius: 8px; word-break: break-all; min-height: 50px; text-align: center;
        }
    </style>
</head>
<body>

    <div id="reader"></div>
    <div id="result">Результат появится здесь...</div>

    <script>
        const scanner = new Html5Qrcode("reader");
        const resultContainer = document.getElementById('result');

        const config = { 
            fps: 20, // Высокая частота кадров для плавности
            qrbox: { width: 250, height: 250 }, // Область фокуса
            aspectRatio: 1.0 
        };

        // Запуск сканера с приоритетом на заднюю камеру ("environment")
        scanner.start(
            { facingMode: "environment" }, 
            config,
            (decodedText) => {
                // При успехе: выводим текст
                resultContainer.innerHTML = `<strong>Найдено:</strong><br>${decodedText}`;
            },
            (errorMessage) => {
                // Ошибки поиска (пропускаем, чтобы не спамить в консоль)
            }
        ).catch((err) => {
            resultContainer.innerText = "Ошибка доступа к камере: " + err;
        });
    </script>
</body>
</html>
