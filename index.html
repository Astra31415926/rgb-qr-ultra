<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pro QR Scanner</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        /* Оформление как у мобильного приложения */
        body { margin: 0; background: #000; font-family: -apple-system, sans-serif; color: white; overflow: hidden; }
        
        /* Видоискатель на весь экран */
        #reader { width: 100vw; height: 100vh; }

        /* Панель управления снизу */
        .controls {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
            width: 90%; z-index: 100; text-align: center;
        }

        #result {
            background: rgba(255, 255, 255, 0.9); color: #333;
            padding: 15px; border-radius: 12px; margin-bottom: 15px;
            font-size: 14px; word-break: break-all; box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            display: none; /* Скрыто, пока нет результата */
        }

        .btn-reset {
            background: #007AFF; color: white; border: none; padding: 12px 30px;
            border-radius: 25px; font-size: 16px; font-weight: bold; cursor: pointer;
            box-shadow: 0 2px 10px rgba(0,122,255,0.4);
        }

        /* Убираем лишние элементы библиотеки */
        #reader__dashboard { display: none !important; }
        #reader video { object-fit: cover !important; }
    </style>
</head>
<body>

    <div id="reader"></div>

    <div class="controls">
        <div id="result"></div>
        <button id="resetBtn" class="btn-reset" style="display: none;" onclick="resetScanner()">Сканировать еще</button>
    </div>

    <script>
        const resultContainer = document.getElementById('result');
        const resetBtn = document.getElementById('resetBtn');
        
        const html5QrCode = new Html5Qrcode("reader");

        const config = { 
            fps: 25, 
            qrbox: { width: 250, height: 250 },
            aspectRatio: 1.0
        };

        function startScanner() {
            html5QrCode.start(
                { facingMode: "environment" }, 
                config,
                (decodedText) => {
                    // Когда код найден:
                    html5QrCode.pause(true); // Пауза камеры
                    resultContainer.innerText = "Результат: " + decodedText;
                    resultContainer.style.display = "block";
                    resetBtn.style.display = "inline-block";
                }
            ).catch(err => console.error("Ошибка:", err));
        }

        function resetScanner() {
            resultContainer.style.display = "none";
            resetBtn.style.display = "none";
            html5QrCode.resume(); // Оживляем камеру
        }

        startScanner();
    </script>
</body>
</html>
