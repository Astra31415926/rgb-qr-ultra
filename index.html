<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QRGB Ultra</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
    <style>
        :root { --r: #ff004d; --g: #00ff41; --b: #0088ff; --bg: #0a0a0a; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: #e0e0e0; }
        .font-display { font-family: 'Space Grotesk', sans-serif; }
        .input-r { border-left: 3px solid var(--r); }
        .input-g { border-left: 3px solid var(--g); }
        .input-b { border-left: 3px solid var(--b); }
        canvas { image-rendering: pixelated; }
        .hidden { display: none; }
    </style>
</head>
<body class="min-h-screen flex flex-col">
    <header class="sticky top-0 z-50 bg-black/80 backdrop-blur-md border-b border-white/10 p-4 flex items-center gap-4">
        <canvas id="livePreviewCanvas" width="56" height="56" class="w-12 h-12 rounded-lg bg-zinc-900 border border-white/10"></canvas>
        <h1 class="font-display font-bold text-xl tracking-tight">QRGB Ultra</h1>
    </header>

    <nav class="flex border-b border-white/10 bg-zinc-900/50">
        <button id="tabGen" class="flex-1 py-3 text-sm font-bold border-b-2 border-red-500 text-red-500">GENERATE</button>
        <button id="tabScan" class="flex-1 py-3 text-sm font-bold border-b-2 border-transparent text-zinc-500">SCAN</button>
    </nav>

    <main class="flex-1 p-4 overflow-y-auto">
        <section id="genSection" class="space-y-6">
            <div class="flex flex-col items-center">
                <div class="p-3 bg-zinc-900 rounded-2xl border border-white/10 shadow-2xl">
                    <canvas id="qrCanvas" width="240" height="240" class="rounded-lg"></canvas>
                </div>
                <p class="text-[10px] text-zinc-500 mt-2 uppercase tracking-widest">Real-time RGB Encoding</p>
            </div>

            <div class="space-y-4">
                <div class="relative">
                    <textarea id="inR" class="input-r w-full bg-zinc-900 border border-white/5 rounded-xl p-3 text-sm focus:outline-none" rows="2" placeholder="Red Channel Data..."></textarea>
                    <span id="cR" class="absolute bottom-2 right-2 text-[10px] text-zinc-600">0/500</span>
                </div>
                <div class="relative">
                    <textarea id="inG" class="input-g w-full bg-zinc-900 border border-white/5 rounded-xl p-3 text-sm focus:outline-none" rows="2" placeholder="Green Channel Data..."></textarea>
                    <span id="cG" class="absolute bottom-2 right-2 text-[10px] text-zinc-600">0/500</span>
                </div>
                <div class="relative">
                    <textarea id="inB" class="input-b w-full bg-zinc-900 border border-white/5 rounded-xl p-3 text-sm focus:outline-none" rows="2" placeholder="Blue Channel Data..."></textarea>
                    <span id="cB" class="absolute bottom-2 right-2 text-[10px] text-zinc-600">0/500</span>
                </div>
            </div>
            <button id="btnDl" class="w-full py-4 bg-white text-black font-bold rounded-xl active:scale-95 transition-transform">DOWNLOAD PNG</button>
        </section>

        <section id="scanSection" class="hidden space-y-4">
            <div id="scanMenu" class="flex flex-col gap-4">
                <button id="btnCam" class="py-10 bg-zinc-900 border border-white/10 rounded-2xl flex flex-col items-center gap-2">
                    <span class="text-3xl">📷</span>
                    <span class="font-bold">USE CAMERA</span>
                </button>
                <button id="btnFile" class="py-10 bg-zinc-900 border border-white/10 rounded-2xl flex flex-col items-center gap-2">
                    <span class="text-3xl">🖼️</span>
                    <span class="font-bold">UPLOAD IMAGE</span>
                </button>
                <input type="file" id="fileIn" class="hidden" accept="image/*">
            </div>

            <div id="camView" class="hidden relative rounded-2xl overflow-hidden bg-black">
                <video id="video" class="w-full h-auto" playsinline></video>
                <button id="btnStop" class="absolute top-2 right-2 bg-red-500 p-2 rounded-lg text-xs font-bold">CLOSE</button>
            </div>
        </section>
    </main>

    <script>
    (function() {
        const size = 240;
        let stream = null;

        const el = {
            inR: document.getElementById('inR'), inG: document.getElementById('inG'), inB: document.getElementById('inB'),
            qr: document.getElementById('qrCanvas'), live: document.getElementById('livePreviewCanvas'),
            genS: document.getElementById('genSection'), scanS: document.getElementById('scanSection'),
            tG: document.getElementById('tabGen'), tS: document.getElementById('tabScan'),
            v: document.getElementById('video'), fIn: document.getElementById('fileIn')
        };

        async function createLayer(text) {
            const c = document.createElement('canvas');
            await QRCode.toCanvas(c, text || " ", { width: size, margin: 1, errorCorrectionLevel: 'M' });
            return c.getContext('2d').getImageData(0, 0, size, size).data;
        }

        async function updateQR() {
            const ctx = el.qr.getContext('2d');
            const [dR, dG, dB] = await Promise.all([createLayer(el.inR.value), createLayer(el.inG.value), createLayer(el.inB.value)]);
            
            const out = ctx.createImageData(size, size);
            for (let i = 0; i < out.data.length; i += 4) {
                out.data[i] = dR[i] < 128 ? 255 : 0;     // Red
                out.data[i+1] = dG[i] < 128 ? 255 : 0;   // Green
                out.data[i+2] = dB[i] < 128 ? 255 : 0;   // Blue
                out.data[i+3] = 255;                     // Alpha
            }
            ctx.putImageData(out, 0, 0);
            el.live.getContext('2d').drawImage(el.qr, 0, 0, 56, 56);
        }

        // Tab Logic
        el.tG.onclick = () => { 
            el.genS.classList.remove('hidden'); el.scanS.classList.add('hidden');
            el.tG.classList.add('border-red-500', 'text-red-500'); el.tS.classList.replace('text-zinc-500', 'border-transparent');
        };
        el.tS.onclick = () => {
            el.genS.classList.add('hidden'); el.scanS.classList.remove('hidden');
            el.tS.classList.add('border-red-500', 'text-red-500'); el.tG.classList.replace('text-red-500', 'border-transparent');
        };

        // Camera Logic
        document.getElementById('btnCam').onclick = async () => {
            try {
                stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
                el.v.srcObject = stream; el.v.play();
                document.getElementById('camView').classList.remove('hidden');
                document.getElementById('scanMenu').classList.add('hidden');
            } catch (e) { alert("Камера недоступна (потрібен HTTPS)"); }
        };

        document.getElementById('btnStop').onclick = () => {
            if(stream) stream.getTracks().forEach(t => t.stop());
            document.getElementById('camView').classList.add('hidden');
            document.getElementById('scanMenu').classList.remove('hidden');
        };

        // Inputs
        [el.inR, el.inG, el.inB].forEach(i => i.oninput = () => {
            document.getElementById('c' + i.id.slice(-1)).innerText = `${i.value.length}/500`;
            updateQR();
        });

        // Download
        document.getElementById('btnDl').onclick = () => {
            const link = document.createElement('a');
            link.download = `qrgb_${Date.now()}.png`;
            link.href = el.qr.toDataURL();
            link.click();
        };

        updateQR(); // Initial build
    })();
    </script>
</body>
</html>
