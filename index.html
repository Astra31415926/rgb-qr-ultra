<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>▣ QRGB ULTRA - Neural Engine v5.1</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        body { background: #000; color: #fff; font-family: 'Inter', system-ui, sans-serif; overflow-x: hidden; }
        canvas { image-rendering: pixelated; }
        textarea { background: #0a0a0a; border: 1px solid #333; color: #fff; font-family: monospace; }
        
        /* Логотип */
        .logo-q { color: #fff; text-shadow: 0 0 10px rgba(255,255,255,0.6); }
        .logo-r { color: #FF004D; text-shadow: 0 0 10px #FF004D; }
        .logo-g { color: #00FF41; text-shadow: 0 0 10px #00FF41; }
        .logo-b { color: #0088FF; text-shadow: 0 0 10px #0088FF; }

        /* Анимация сканирования */
        .scan-line { 
            position:absolute; left:0; right:0; height:3px; 
            background:linear-gradient(90deg,transparent,#00ff41,transparent); 
            box-shadow:0 0 20px #00ff41; 
            top: 0; 
            z-index: 10;
            display: none;
        }
        .scan-active .scan-line {
            display: block;
            animation: scanLine 2.0s linear forwards; /* Speed up slightly */
        }
        @keyframes scanLine { 0%{top:0%;} 100%{top:100%;} }
        
        @keyframes flash { 0%,100%{opacity:0} 50%{opacity:.9} }
        .flash { animation:flash .3s; }
        
        .indicator { width: 12px; height: 12px; border-radius: 50%; background: #222; border: 1px solid rgba(255,255,255,0.1); transition: all 0.3s; }
        .active-r { background: #ff004d; box-shadow: 0 0 10px #ff004d; }
        .active-g { background: #00ff41; box-shadow: 0 0 10px #00ff41; }
        .active-b { background: #0088ff; box-shadow: 0 0 10px #0088ff; }
        
        /* Видео и Картинки */
        #video { object-fit: cover; }
        
        /* Меню */
        .dropdown-menu {
            transform: translateY(-10px);
            opacity: 0;
            visibility: hidden;
            transition: all 0.2s ease;
            max-height: 70vh;
            overflow-y: auto;
        }
        .dropdown-menu.show {
            transform: translateY(0);
            opacity: 1;
            visibility: visible;
        }
        
        .modal-overlay { opacity: 0; visibility: hidden; transition: all 0.3s ease; }
        .modal-overlay.show { opacity: 1; visibility: visible; }
        
        .modal-content { transform: scale(0.9); transition: transform 0.3s ease; }
        .modal-overlay.show .modal-content { transform: scale(1); }

        .lang-switch { display: flex; gap: 2px; background: #1a1a1a; padding: 2px; border-radius: 6px; font-size: 10px; font-weight: 700; }
        .lang-btn { padding: 4px 6px; border-radius: 4px; cursor: pointer; opacity: 0.5; transition: all 0.2s; }
        .lang-btn.active { opacity: 1; background: #333; color: #fff; }
        
        .modal-content a { color: #60a5fa; text-decoration: underline; }
        
        /* Processing Indicator */
        .processing-spinner {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 40px; height: 40px;
            border: 4px solid rgba(255,255,255,0.1);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            z-index: 20;
            display: none;
        }
        .is-processing .processing-spinner { display: block; }
        @keyframes spin { to { transform: translate(-50%, -50%) rotate(360deg); } }
        
        /* Debug Toggle */
        .toggle-bg { background: #333; width: 36px; height: 18px; border-radius: 9px; position: relative; cursor: pointer; transition: background 0.2s; }
        .toggle-bg.active { background: #00ff41; }
        .toggle-knob { position: absolute; top: 1px; left: 1px; width: 16px; height: 16px; background: #fff; border-radius: 50%; transition: transform 0.2s; }
        .toggle-bg.active .toggle-knob { transform: translateX(18px); }
    </style>
</head>
<body class="flex flex-col min-h-screen p-6">

    <!-- Header -->
    <div class="flex items-center justify-between mb-6 relative">
        <canvas id="mini-qr" width="44" height="44" class="rounded bg-zinc-900 border border-white/10"></canvas>
        
        <h1 class="text-xl font-extrabold tracking-widest uppercase text-center flex-1 flex justify-center gap-0.5">
            <span class="logo-q">Q</span><span class="logo-r">R</span><span class="logo-g">G</span><span class="logo-b">B</span>
        </h1>
        
        <div class="flex items-center gap-3 z-50">
            <div class="lang-switch">
                <div id="lang-uk" class="lang-btn active" onclick="setLanguage('uk')">UK</div>
                <div id="lang-en" class="lang-btn" onclick="setLanguage('en')">EN</div>
            </div>
            <button id="menu-btn" class="w-10 text-white text-xl active:scale-90 transition-transform">☰</button>
        </div>
        
        <!-- Menu Dropdown -->
        <div id="dropdown" class="dropdown-menu absolute top-full right-0 mt-2 w-64 bg-zinc-900 rounded-xl border border-white/10 shadow-2xl z-50 overflow-hidden">
            <!-- Debug Mode Toggle -->
            <div class="p-3 border-b border-white/10 flex justify-between items-center">
                <span class="text-[10px] font-bold text-zinc-400 uppercase">Debug View</span>
                <div id="debug-toggle" onclick="toggleDebug()" class="toggle-bg">
                    <div class="toggle-knob"></div>
                </div>
            </div>
            
            <a href="#" onclick="openModal('usage')" class="block px-4 py-3 text-xs text-zinc-300 hover:bg-zinc-800 border-b border-white/5" data-i18n="menu_usage">Як користуватися</a>
            <a href="#" onclick="openModal('tech')" class="block px-4 py-3 text-xs text-zinc-300 hover:bg-zinc-800 border-b border-white/5" data-i18n="menu_tech">Технологія</a>
            <a href="#" onclick="openModal('author')" class="block px-4 py-3 text-xs text-zinc-300 hover:bg-zinc-800 border-b border-white/5" data-i18n="menu_author">Автор і контакти</a>
            <button onclick="globalReset()" class="w-full text-left px-4 py-3 text-xs text-red-400 hover:bg-zinc-800 font-bold uppercase tracking-wide" data-i18n="menu_reset">Reset</button>
        </div>
    </div>

    <!-- Inputs -->
    <div class="space-y-3 mb-6">
        <textarea id="r-text" class="w-full p-4 rounded-xl border-l-4 border-red-600 outline-none h-14 text-sm" placeholder="RED CHANNEL..."></textarea>
        <textarea id="g-text" class="w-full p-4 rounded-xl border-l-4 border-green-600 outline-none h-14 text-sm" placeholder="GREEN CHANNEL..."></textarea>
        <textarea id="b-text" class="w-full p-4 rounded-xl border-l-4 border-blue-600 outline-none h-14 text-sm" placeholder="BLUE (PRIORITY)..."></textarea>
    </div>

    <!-- Central Frame -->
    <div class="flex-1 flex flex-col items-center justify-center mb-6">
        <div id="central-container" class="relative w-72 h-72 bg-zinc-950 rounded-[2rem] p-5 border border-white/5 shadow-2xl overflow-hidden">
            <canvas id="qr-main" width="512" height="512" class="w-full h-full transition-opacity duration-500"></canvas>
            <video id="video" class="absolute inset-0 w-full h-full object-cover hidden" playsinline></video>
            <canvas id="freeze-frame" class="absolute inset-0 w-full h-full object-cover hidden z-10"></canvas>
            
            <div class="scan-line"></div>
            <div id="flash-layer" class="absolute inset-0 bg-white opacity-0 pointer-events-none z-50"></div>
            <div class="processing-spinner"></div>
        </div>

        <!-- Result Indicators -->
        <div id="result-indicators" class="w-72 mt-4 space-y-2 opacity-0 transition-opacity duration-300">
            <div id="res-r" class="p-3 bg-zinc-900/60 rounded-xl flex items-center gap-3 border border-white/5">
                <div class="indicator"></div>
                <span class="text-[10px] text-zinc-500 uppercase tracking-tighter">R: Waiting...</span>
            </div>
            <div id="res-g" class="p-3 bg-zinc-900/60 rounded-xl flex items-center gap-3 border border-white/5">
                <div class="indicator"></div>
                <span class="text-[10px] text-zinc-500 uppercase tracking-tighter">G: Waiting...</span>
            </div>
            <div id="res-b" class="p-3 bg-zinc-900/60 rounded-xl flex items-center gap-3 border border-blue-500/20">
                <div class="indicator"></div>
                <span class="text-[10px] text-zinc-400 uppercase tracking-tighter">B: Priority Ready</span>
            </div>
        </div>
    </div>

    <!-- Actions -->
    <div class="space-y-3 pb-4">
        <button id="save-btn" onclick="saveQR()" class="w-full py-4 bg-white text-black font-black rounded-2xl hidden active:scale-95 text-xs tracking-widest uppercase" data-i18n="btn_save">Save Result</button>
        <div class="grid grid-cols-2 gap-3">
            <button onclick="startCamera()" class="py-4 bg-zinc-900 text-white font-bold rounded-2xl border border-white/10 active:scale-95 text-[10px] uppercase tracking-widest" data-i18n="btn_camera">Open Camera</button>
            <input type="file" id="file-input" accept="image/*" class="hidden" onchange="handleFile(event)">
            <button onclick="triggerFileInput()" class="py-4 bg-zinc-900 text-white font-bold rounded-2xl border border-white/10 active:scale-95 text-[10px] uppercase tracking-widest" data-i18n="btn_gallery">Open Gallery</button>
        </div>
    </div>

    <!-- Modal -->
    <div id="modal-overlay" class="modal-overlay fixed inset-0 z-[200] flex items-center justify-center p-6 bg-black/60 backdrop-blur-xl">
        <div class="modal-content w-full max-w-md bg-zinc-900/80 border border-white/10 rounded-3xl p-6 shadow-2xl relative max-h-[80vh] overflow-y-auto">
            <button onclick="closeModal()" class="absolute top-4 right-4 text-zinc-500 hover:text-white text-xs font-bold border border-white/10 px-3 py-1 rounded-lg" data-i18n="btn_close">CLOSE</button>
            <h2 id="modal-title" class="text-lg font-bold mb-4 pr-10"></h2>
            <div id="modal-body" class="text-sm text-zinc-300 space-y-4 leading-relaxed"></div>
        </div>
    </div>

    <script>
        // --- WORKER CODE (Inline) ---
        // Увесь важкий код обробки винесено в окремий потік
        const workerCode = `
            importScripts('https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js');

            const SCIMatrixProcessor = {
                L_ref: 0, U_ref: 255,
                matrix: [1,0,0, 0,1,0, 0,0,1], // Identity default
                
                setMatrix: function(m) { if(m.length===9) this.matrix = m; },
                
                // Розділення каналів з урахуванням матриці
                separate: function(data, w, h) {
                    const len = data.length;
                    const rBuf = new Uint8ClampedArray(len);
                    const gBuf = new Uint8ClampedArray(len);
                    const bBuf = new Uint8ClampedArray(len);
                    const grayBuf = new Uint8ClampedArray(len); // Fallback
                    
                    const m = this.matrix;
                    const range = (this.U_ref - this.L_ref) || 1;

                    for (let i = 0; i < len; i += 4) {
                        let rN = (data[i]   - this.L_ref) / range;
                        let gN = (data[i+1] - this.L_ref) / range;
                        let bN = (data[i+2] - this.L_ref) / range;

                        // Deconvolution
                        let pR = (m[0]*rN + m[1]*gN + m[2]*bN) * 255;
                        let pG = (m[3]*rN + m[4]*gN + m[5]*bN) * 255;
                        let pB = (m[6]*rN + m[7]*gN + m[8]*bN) * 255;

                        // Clamp & Store
                        let vR = Math.max(0, Math.min(255, pR));
                        let vG = Math.max(0, Math.min(255, pG));
                        let vB = Math.max(0, Math.min(255, pB));

                        // Write Buffers (Grayscale format R=G=B)
                        rBuf[i] = rBuf[i+1] = rBuf[i+2] = vR; rBuf[i+3] = 255;
                        gBuf[i] = gBuf[i+1] = gBuf[i+2] = vG; gBuf[i+3] = 255;
                        bBuf[i] = bBuf[i+1] = bBuf[i+2] = vB; bBuf[i+3] = 255;
                        
                        // Standard Luminance
                        let lum = 0.299*data[i] + 0.587*data[i+1] + 0.114*data[i+2];
                        grayBuf[i] = grayBuf[i+1] = grayBuf[i+2] = lum; grayBuf[i+3] = 255;
                    }
                    return { r: rBuf, g: gBuf, b: bBuf, gray: grayBuf };
                }
            };

            // --- Image Processing Utils ---
            
            // Швидкий Median Filter (3x3) для шуму
            function medianFilter(inBuf, w, h) {
                const outBuf = new Uint8ClampedArray(inBuf.length);
                // Копіюємо краї без змін (спрощення)
                for(let y=1; y<h-1; y++) {
                    for(let x=1; x<w-1; x++) {
                        const idx = (y*w + x)*4;
                        let neighbors = [];
                        // 3x3 window
                        for(let ky=-1; ky<=1; ky++) {
                            for(let kx=-1; kx<=1; kx++) {
                                neighbors.push(inBuf[((y+ky)*w + (x+kx))*4]);
                            }
                        }
                        neighbors.sort((a,b)=>a-b);
                        const med = neighbors[4]; // Median of 9
                        outBuf[idx] = outBuf[idx+1] = outBuf[idx+2] = med;
                        outBuf[idx+3] = 255;
                    }
                }
                return outBuf;
            }

            // Sauvola Binarization using Integral Images
            function sauvolaBinarize(inBuf, w, h, k=0.2, windowSize=15) {
                const outBuf = new Uint8ClampedArray(inBuf.length);
                const intImg = new Float32Array(w*h);
                const intImgSq = new Float32Array(w*h);
                
                // Compute Integral Images
                for(let y=0; y<h; y++) {
                    let sum=0, sumSq=0;
                    for(let x=0; x<w; x++) {
                        const idx = y*w + x;
                        const val = inBuf[idx*4]; // R channel
                        sum += val;
                        sumSq += val*val;
                        intImg[idx] = (y>0 ? intImg[idx-w] : 0) + sum;
                        intImgSq[idx] = (y>0 ? intImgSq[idx-w] : 0) + sumSq;
                    }
                }

                const whalf = Math.floor(windowSize/2);
                const area = windowSize*windowSize;
                
                for(let y=0; y<h; y++) {
                    for(let x=0; x<w; x++) {
                        const idx = (y*w + x)*4;
                        
                        // Window bounds
                        const x1 = Math.max(0, x - whalf);
                        const y1 = Math.max(0, y - whalf);
                        const x2 = Math.min(w-1, x + whalf);
                        const y2 = Math.min(h-1, y + whalf);
                        
                        // Sum from Integral Image
                        // S(x,y) = I(D) - I(B) - I(C) + I(A)
                        // A=(x1,y1), B=(x2,y1), C=(x1,y2), D=(x2,y2)
                        const count = (x2-x1)*(y2-y1); // dynamic area on edges
                        
                        const getSum = (img, px, py) => (px>=0 && py>=0) ? img[py*w + px] : 0;
                        
                        const sum = getSum(intImg, x2, y2) - getSum(intImg, x1-1, y2) - getSum(intImg, x2, y1-1) + getSum(intImg, x1-1, y1-1);
                        const sumSq = getSum(intImgSq, x2, y2) - getSum(intImgSq, x1-1, y2) - getSum(intImgSq, x2, y1-1) + getSum(intImgSq, x1-1, y1-1);
                        
                        const mean = sum / count;
                        const variance = (sumSq / count) - (mean * mean);
                        const std = Math.sqrt(Math.max(0, variance)); // Clamp sqrt to 0
                        
                        // Sauvola Threshold
                        const T = mean * (1 + k * (std / 128 - 1));
                        
                        // Binarize
                        const val = inBuf[idx] < T ? 0 : 255;
                        outBuf[idx] = outBuf[idx+1] = outBuf[idx+2] = val;
                        outBuf[idx+3] = 255;
                    }
                }
                return outBuf;
            }

            // Morphological Closing (3x3) - Connects broken modules
            function morphClose(inBuf, w, h) {
                // Simplified Dilation then Erosion
                const dilated = new Uint8ClampedArray(inBuf.length);
                const eroded = new Uint8ClampedArray(inBuf.length);
                
                // Dilation (Max)
                for(let y=1; y<h-1; y++) {
                    for(let x=1; x<w-1; x++) {
                        let max = 0;
                        for(let ky=-1; ky<=1; ky++) {
                            for(let kx=-1; kx<=1; kx++) {
                                const v = inBuf[((y+ky)*w + (x+kx))*4];
                                if(v > max) max = v;
                            }
                        }
                        const idx = (y*w+x)*4;
                        dilated[idx] = dilated[idx+1] = dilated[idx+2] = max;
                        dilated[idx+3] = 255;
                    }
                }
                
                // Erosion (Min)
                 for(let y=1; y<h-1; y++) {
                    for(let x=1; x<w-1; x++) {
                        let min = 255;
                        for(let ky=-1; ky<=1; ky++) {
                            for(let kx=-1; kx<=1; kx++) {
                                const v = dilated[((y+ky)*w + (x+kx))*4];
                                if(v < min) min = v;
                            }
                        }
                        const idx = (y*w+x)*4;
                        eroded[idx] = eroded[idx+1] = eroded[idx+2] = min;
                        eroded[idx+3] = 255;
                    }
                }
                return eroded;
            }

            // --- Main Worker Logic ---
            self.onmessage = function(e) {
                const { type, payload } = e.data;
                
                if(type === 'setMatrix') {
                    SCIMatrixProcessor.setMatrix(payload);
                    return;
                }
                
                if(type === 'process') {
                    const { imgData, w, h, debug } = payload;
                    const results = {r:null, g:null, b:null, gray:null};
                    let foundAny = false;
                    let debugBuffer = null;

                    // 1. SCI Separation
                    const separated = SCIMatrixProcessor.separate(imgData, w, h);
                    
                    const channels = ['r', 'g', 'b', 'gray'];
                    const buffers = [separated.r, separated.g, separated.b, separated.gray];
                    
                    // Loop through channels
                    outerLoop:
                    for(let i=0; i<channels.length; i++) {
                        const ch = channels[i];
                        const buf = buffers[i];
                        
                        // 2. Noise Filtering (Median)
                        const filtered = medianFilter(buf, w, h);
                        
                        // 3. Adaptive Binarization (Sauvola)
                        const binary = sauvolaBinarize(filtered, w, h, 0.2, 15);
                        
                        // 4. Morphological Correction (Close)
                        const corrected = morphClose(binary, w, h);
                        
                        // Capture Debug Frame (once, e.g., for Red channel)
                        if(i === 0 && debug) debugBuffer = corrected;

                        // 5. Decode Attempt
                        const code = jsQR(corrected, w, h, { inversionAttempts: "attemptBoth" });
                        if(code) {
                            results[ch] = code.data;
                            foundAny = true;
                            // Optional: break if priority channel found?
                            // No, let's find all valid channels.
                        }
                    }
                    
                    self.postMessage({ results, debugBuffer, foundAny });
                }
            };
        `;

        // Create Worker Blob
        const blob = new Blob([workerCode], { type: 'application/javascript' });
        const workerUrl = URL.createObjectURL(blob);
        const processorWorker = new Worker(workerUrl);

        // --- LOCALIZATION ---
        const translations = {
            uk: {
                menu_usage: "Як користуватися", menu_tech: "Технологія", menu_author: "Автор", menu_reset: "Reset",
                btn_save: "Зберегти PNG", btn_camera: "Камера", btn_gallery: "Галерея", btn_close: "ЗАКРИТИ",
                ph_r: "Red...", ph_g: "Green...", ph_b: "Blue...",
                res_wait: "Аналіз...", res_fail: "[!] Помилка",
                m_tech_title: "⚙️ Технологія",
                m_tech_body: `<p>Алгоритм: Sauvola Binarization + SCI Deconvolution. Використовується Web Worker для обробки зображень без гальмування інтерфейсу.</p>`
            },
            en: {
                menu_usage: "How to use", menu_tech: "Technology", menu_author: "Author", menu_reset: "Reset",
                btn_save: "Save PNG", btn_camera: "Camera", btn_gallery: "Gallery", btn_close: "CLOSE",
                ph_r: "Red...", ph_g: "Green...", ph_b: "Blue...",
                res_wait: "Processing...", res_fail: "[!] Failed",
                m_tech_title: "⚙️ Technology",
                m_tech_body: `<p>Algorithm: Sauvola Binarization + SCI Deconvolution. Uses Web Worker for non-blocking UI processing.</p>`
            }
        };
        let currentLang = 'uk';
        function setLanguage(lang) {
            currentLang = lang;
            document.getElementById('lang-uk').classList.toggle('active', lang === 'uk');
            document.getElementById('lang-en').classList.toggle('active', lang === 'en');
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (translations[lang][key]) el.textContent = translations[lang][key];
            });
            els.r.placeholder = translations[lang].ph_r;
            els.g.placeholder = translations[lang].ph_g;
            els.b.placeholder = translations[lang].ph_b;
        }

        // --- ELEMENTS & STATE ---
        const els = {
            r: document.getElementById('r-text'), g: document.getElementById('g-text'), b: document.getElementById('b-text'),
            main: document.getElementById('qr-main'), mini: document.getElementById('mini-qr'),
            video: document.getElementById('video'), freeze: document.getElementById('freeze-frame'),
            centralContainer: document.getElementById('central-container'), flash: document.getElementById('flash-layer'),
            resultIndicators: document.getElementById('result-indicators'),
            resR: document.getElementById('res-r'), resG: document.getElementById('res-g'), resB: document.getElementById('res-b'),
            debugToggle: document.getElementById('debug-toggle')
        };

        let scanning = false;
        let results = {r:null, g:null, b:null};
        let analysisReady = false;
        let debugMode = false;

        // Worker Message Handler
        processorWorker.onmessage = function(e) {
            const { results: res, debugBuffer, foundAny } = e.data;
            
            // Merge results
            if(res.r) results.r = res.r;
            if(res.g) results.g = res.g;
            if(res.b) results.b = res.b;
            if(res.gray && !results.b && !results.r && !results.g) results.b = res.gray; // Fallback fallback

            // Debug Draw
            if(debugMode && debugBuffer) {
                const ctx = els.freeze.getContext('2d');
                ctx.putImageData(new ImageData(debugBuffer, 480, 480), 0, 0);
            }

            if(foundAny) {
                if (results.b || (results.r && results.g && results.b)) {
                    analysisReady = true;
                    if(scanning) triggerCaptureSequence(); // Stop camera if found
                    else finalizeAnalysis(); // File upload path
                }
            } else {
                 // If nothing found after processing
                 if(!scanning) handleFailUI(); 
            }
            
            els.centralContainer.classList.remove('is-processing');
        };

        // --- MENU LOGIC ---
        document.getElementById('menu-btn').addEventListener('click', (e) => {
            e.stopPropagation();
            document.getElementById('dropdown').classList.toggle('show');
        });
        document.addEventListener('click', (e) => {
            if (!e.target.closest('#dropdown') && !e.target.closest('#menu-btn') && !e.target.closest('.lang-switch')) {
                document.getElementById('dropdown').classList.remove('show');
            }
        });
        
        function toggleDebug() {
            debugMode = !debugMode;
            els.debugToggle.classList.toggle('active', debugMode);
            console.log("Debug Mode:", debugMode);
        }

        function globalReset() {
            stopCamera();
            els.r.value = ""; els.g.value = ""; els.b.value = "";
            generateQR();
            els.resultIndicators.style.opacity = 0;
            els.main.classList.remove('hidden');
            els.freeze.classList.add('hidden');
            els.video.classList.add('hidden');
            document.getElementById('dropdown').classList.remove('show');
        }

        // --- QR Generation ---
        function generateQR() {
            const texts = [els.r.value, els.g.value, els.b.value];
            if (!texts.some(t => t.trim())) {
                els.main.style.opacity = 0;
                document.getElementById('save-btn').classList.add('hidden');
                return;
            }
            els.main.style.opacity = 1; els.freeze.classList.add('hidden'); els.video.classList.add('hidden');
            let maxVer = 1;
            texts.forEach(t => {
                if(!t.trim()) return;
                const tmp = qrcode(0, 'M'); tmp.addData(unescape(encodeURIComponent(t || " "))); tmp.make();
                const v = Math.floor((tmp.getModuleCount() - 17) / 4);
                if (v > maxVer) maxVer = v;
            });
            const ctx = els.main.getContext('2d');
            ctx.fillStyle = "#000"; ctx.fillRect(0,0,512,512);
            ctx.globalCompositeOperation = "lighten";
            texts.forEach((text, i) => {
                if(!text.trim()) return;
                const qr = qrcode(maxVer, 'M'); qr.addData(unescape(encodeURIComponent(text))); qr.make();
                const mod = 512 / qr.getModuleCount();
                ctx.fillStyle = i === 0 ? "#FF0000" : (i === 1 ? "#00FF00" : "#0000FF");
                for (let r = 0; r < qr.getModuleCount(); r++) {
                    for (let c = 0; c < qr.getModuleCount(); c++) {
                        if (qr.isDark(r, c)) ctx.fillRect(c * mod, r * mod, mod, mod);
                    }
                }
            });
            ctx.globalCompositeOperation = "source-over";
            document.getElementById('save-btn').classList.remove('hidden');
            els.mini.getContext('2d').drawImage(els.main, 0, 0, 44, 44);
        }
        [els.r, els.g, els.b].forEach(el => el.addEventListener('input', generateQR));

        // --- SCANNER LOGIC ---
        function triggerFileInput() {
            els.r.value = ""; els.g.value = ""; els.b.value = ""; 
            document.getElementById('file-input').click();
        }

        function startCamera() {
            els.r.value = ""; els.g.value = ""; els.b.value = "";
            prepareScannerUI();
            navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
                .then(s => {
                    els.video.srcObject = s;
                    els.video.play();
                    scanning = true;
                    scanLoop();
                })
                .catch(e => { alert("Camera Error"); stopCamera(); });
        }

        function stopCamera() {
            scanning = false;
            if (els.video.srcObject) els.video.srcObject.getTracks().forEach(t => t.stop());
        }
        
        function prepareScannerUI() {
            results = {r:null, g:null, b:null}; analysisReady = false;
            els.main.style.opacity = 0; els.freeze.classList.add('hidden'); els.video.classList.remove('hidden');
            els.resultIndicators.style.opacity = 1;
            ['r', 'g', 'b'].forEach(ch => {
                const el = els['res' + ch.toUpperCase()];
                el.querySelector('span').textContent = ch.toUpperCase() + ': ' + translations[currentLang].res_wait;
                el.querySelector('.indicator').className = 'indicator';
                el.classList.remove('hidden'); el.style.opacity = 0.5;
            });
        }

        // Frame scheduler
        let lastFrameTime = 0;
        const frameInterval = 500; // Process every 500ms to let worker finish
        function scanLoop(ts) {
            if (!scanning) return;
            
            if (ts - lastFrameTime > frameInterval && !analysisReady && els.video.readyState === els.video.HAVE_ENOUGH_DATA) {
                lastFrameTime = ts;
                
                // Show processing indicator
                els.centralContainer.classList.add('is-processing');
                
                // Capture Frame
                const cv = document.createElement('canvas');
                cv.width = 480; cv.height = 480;
                const cx = cv.getContext('2d');
                const vw = els.video.videoWidth, vh = els.video.videoHeight;
                const aspect = vw / vh;
                let sx = 0, sy = 0, sw = vw, sh = vh;
                if (aspect > 1) { sw = vh; sx = (vw - sw) / 2; } else { sh = vw; sy = (vh - sh) / 2; }
                cx.drawImage(els.video, sx, sy, sw, sh, 0, 0, 480, 480);
                
                // Send to Worker
                processorWorker.postMessage({
                    type: 'process',
                    payload: { 
                        imgData: cx.getImageData(0,0,480,480).data.buffer, 
                        w: 480, h: 480, 
                        debug: debugMode 
                    }
                }, [cx.getImageData(0,0,480,480).data.buffer]); // Transferable
                
            } else if (!analysisReady) {
                requestAnimationFrame(scanLoop);
            }
        }
        
        function triggerCaptureSequence() {
            stopCamera();
            // Draw freeze frame
            els.freeze.width = 480; els.freeze.height = 480;
            const fctx = els.freeze.getContext('2d');
            const vw = els.video.videoWidth, vh = els.video.videoHeight;
            const aspect = vw / vh;
            let sx = 0, sy = 0, sw = vw, sh = vh;
            if (aspect > 1) { sw = vh; sx = (vw - sw) / 2; } else { sh = vw; sy = (vh - sh) / 2; }
            fctx.drawImage(els.video, sx, sy, sw, sh, 0, 0, 480, 480);
            
            els.video.classList.add('hidden');
            els.freeze.classList.remove('hidden');
            
            startVisualizationSequence(true);
        }

        function startVisualizationSequence(success) {
            els.centralContainer.classList.add('scan-active');
            // Audio logic...
            setTimeout(() => {
                els.flash.classList.add('flash');
                setTimeout(() => els.flash.classList.remove('flash'), 300);
                if(success) updateResultUI();
                else handleFailUI();
            }, 2000);
        }
        
        function updateResultUI() {
            ['r', 'g', 'b'].forEach(ch => {
                const el = els['res' + ch.toUpperCase()];
                const data = results[ch];
                if(data) {
                    el.querySelector('span').textContent = data;
                    el.querySelector('.indicator').className = 'indicator active-'+ch;
                    el.classList.remove('hidden'); el.style.opacity = 1;
                    els[ch].value = data;
                } else { el.classList.add('hidden'); }
            });
        }

        function handleFailUI() {
            ['r', 'g', 'b'].forEach(ch => {
                const el = els['res' + ch.toUpperCase()];
                el.classList.remove('hidden'); el.style.opacity = 1;
                el.querySelector('span').textContent = translations[currentLang].res_fail;
                el.querySelector('.indicator').className = 'indicator';
            });
        }

        // --- File Handler ---
        function handleFile(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (ev) => {
                const img = new Image();
                img.onload = () => {
                    prepareScannerUI();
                    els.freeze.width = 480; els.freeze.height = 480;
                    const fctx = els.freeze.getContext('2d');
                    fctx.fillStyle = "#000"; fctx.fillRect(0, 0, 480, 480);
                    const aspect = img.width / img.height;
                    let sx = 0, sy = 0, sw = img.width, sh = img.height;
                    if (aspect > 1) { sw = img.height; sx = (img.width - sw) / 2; } else { sh = img.width; sy = (img.height - sh) / 2; }
                    fctx.drawImage(img, sx, sy, sw, sh, 0, 0, 480, 480);
                    els.freeze.classList.remove('hidden'); els.video.classList.add('hidden');
                    
                    // Process via Worker
                    els.centralContainer.classList.add('is-processing');
                    const imgData = fctx.getImageData(0,0,480,480);
                    processorWorker.postMessage({
                        type: 'process',
                        payload: { 
                            imgData: imgData.data.buffer, 
                            w: 480, h: 480, 
                            debug: debugMode 
                        }
                    }, [imgData.data.buffer]);
                };
                img.src = ev.target.result;
            };
            reader.readAsDataURL(file);
        }
        
        function finalizeAnalysis() {
            startVisualizationSequence(analysisReady);
        }

        function saveQR() {
            const a = document.createElement('a');
            a.download = 'QRGB_PRO.png'; a.href = els.main.toDataURL(); a.click();
        }
        
        function openModal(type) { /* same as before */ }
        function closeModal() { document.getElementById('modal-overlay').classList.remove('show'); }
    </script>
</body>
</html>
